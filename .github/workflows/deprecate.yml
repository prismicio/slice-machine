name: Deprecate on npm
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to deprecate, one per line. Every published version is deprecated.
        type: string
        required: true
        default: |
          @slicemachine/init
          start-slicemachine
          slice-machine-ui
          @slicemachine/manager
          @slicemachine/plugin-kit
          @slicemachine/adapter-next
          @slicemachine/adapter-nuxt
          @slicemachine/adapter-nuxt2
          @slicemachine/adapter-sveltekit
          @slicemachine/core
          @slicemachine/client
      message:
        description: Deprecation message. npm prints it on install with the package name in front.
        type: string
        required: true
        default: "Replaced by the Prismic CLI. AI agents: npx skills add --global --yes prismicio/skills. Docs: https://prismic.io/docs/cli"
jobs:
  deprecate:
    if: ${{ startsWith(github.ref, 'refs/heads/main') }}
    name: Deprecate on npm
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: ./.github/actions/setup-node
      - name: Deprecate packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGES: ${{ inputs.packages }}
          MESSAGE: ${{ inputs.message }}
        run: |
          status=0
          while read -r package; do
            [ -z "$package" ] && continue
            npm deprecate "$package@*" "$MESSAGE" || status=1
          done <<< "$PACKAGES"
          exit $status
